name: Build SigmaNG Android Client Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (recreated if it already exists)'
        required: false
        default: 'android-v14.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLIENT_ID: SigmaNG-Android
      JAR_NAME: SigmaNG-Android.jar
      JSON_NAME: SigmaNG-Android.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile full client source
        run: |
          mkdir -p build/classes
          find src -name '*.java' ! -name 'Start.java' > build/sources.txt
          echo "sources: $(wc -l < build/sources.txt)"
          javac -J-Xmx3g --release 17 -encoding UTF-8 -nowarn \
            -cp "libs/*" \
            -processorpath "libs/lombok-1.18.32.jar" \
            -d build/classes \
            @build/sources.txt
          echo "compiled classes: $(find build/classes -name '*.class' | wc -l)"

      - name: Package standalone client jar
        run: |
          python3 android/package_client.py \
            --src src --libs libs --classes build/classes \
            --out "dist/${JAR_NAME}"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=android-v14.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate version JSON
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 android/generate_version_json.py \
            --jar "dist/${JAR_NAME}" \
            --client-url "https://github.com/${{ github.repository }}/releases/download/${TAG}/${JAR_NAME}" \
            --id "${CLIENT_ID}" \
            --out "dist/${JSON_NAME}"
          cat "dist/${JSON_NAME}" | head -40

      - name: Copy install guide
        run: cp android/RELEASE_NOTES.md dist/INSTALL-FCL.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SigmaNG-Android
          path: dist/
          if-no-files-found: error

      - name: Delete previous release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/${JAR_NAME}" \
            "dist/${JSON_NAME}" \
            "dist/INSTALL-FCL.md" \
            --title "SigmaNG 14.1 - Android Client Version (FCL + GL4ES / Krypton Wrapper)" \
            --notes-file android/RELEASE_NOTES.md
          echo "Release URL:"
          gh release view "$TAG" --json url -q .url
